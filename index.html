<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YODA</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f17; color: #c9d1dc; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { text-align: center; padding: 2rem; max-width: 28rem; }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: #22c55e22; display: inline-grid; place-items: center; color: #4ade80; font-weight: 700; margin-bottom: .75rem; }
  a { color: #7aa2ff; }
  .dim { color: #6b7684; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="mark">Y</div>
  <h1 style="font-size:18px;margin:0 0 .25rem">Connecting to YODA…</h1>
  <p id="msg" class="dim">Finding today's address.</p>
</main>
<script>
// The intranet runs on Ben's laptop behind a Cloudflare quick tunnel whose
// address changes every time it restarts. start_tunnel.sh writes the current
// one to tunnel.json in this repo; this page reads it through the GitHub API
// (never cached) and forwards. If the tunnel is down, say so instead of 404ing.
// Two ways to read the pointer: the API (never cached, but 60 anonymous
// requests an hour per address), then the raw file (no limit, cached up to
// five minutes) when the API is rate-limited or down.
async function readPointer() {
  try {
    const r = await fetch("https://api.github.com/repos/benrathi/yoda/contents/tunnel.json", { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      return JSON.parse(atob(j.content.replace(/\n/g, "")));
    }
  } catch (e) {
    /* fall through */
  }
  const r = await fetch("https://raw.githubusercontent.com/benrathi/yoda/main/tunnel.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("raw " + r.status);
  return r.json();
}
(async () => {
  const msg = document.getElementById("msg");
  try {
    const t = await readPointer();
    if (t.url) {
      const target = t.url.replace(/\/$/, "") + (location.search || "");
      msg.innerHTML = 'Opening <a href="' + target + '">' + target.replace(/^https:\/\//, "") + '</a>…';
      location.replace(target);
    } else {
      msg.innerHTML = "YODA is offline right now (the laptop that serves it is asleep or the tunnel stopped). Try again later." + (t.updated_at ? "<br>Last change " + new Date(t.updated_at).toLocaleString() + "." : "");
    }
  } catch (e) {
    msg.textContent = "Couldn't read the current address (" + e.message + "). Try again in a minute.";
  }
})();
</script>
</body>
</html>
